###  / \   ### For analysis of real datasets, please use config_template instead.
### / | \  ### The ressources parameters in config_test_evaluation_only.yaml were chosen to use as few ressources as possible for the test dataset
###/  *  \ ### On bigger and more complex datasets, using this config file might lead to crashes

analysis_name: test # Used to name the logs files

##################
##### Inputs #####
##################

### Samples ###
# technology options: hifi, ont, illumina
# Sample model:
# - hifi and ont samples must define read_path.
# - hifi and ont samples may optionally define auxiliary_short_reads for hybrid tools such as OperaMS and/or short_read_cobinning.
# - illumina samples must define read_path: none and short_reads_1/short_reads_2.
# - Do not define short_reads_1/short_reads_2 inside hifi or ont samples.
# - Do not define auxiliary_short_reads_1/2 inside illumina samples.

samples:
 - name: test_dataset
   technology: hifi
   read_path: test/test_dataset.fastq
   # auxiliary_short_reads_1/2 are optional and used only by hybrid tools such as OPERA-MS and short_read_cobinning.
   # auxiliary_short_reads_1: /path/to/illumina_R1.fastq.gz
   # auxiliary_short_reads_2: /path/to/illumina_R2.fastq.gz

# - name: test_dataset_illumina
#   technology: illumina
#   read_path: none
#   short_reads_1: /path/to/illumina_R1.fastq.gz
#   short_reads_2: /path/to/illumina_R2.fastq.gz

# (Optional): Pre-assembled short-read contig file used by OPERA-MS only, should be from the same sample as the long reads.
#             It is not used by metaspades, short_read_binning, or short_read_mapping_evaluation.
#short_read_assembly: /path/to/short_read_assembly.fasta

# (Optional): Additional long-read datasets used only for additional_reads_cobinning. These reads are not used for assembly.
#             They are mapped to the contigs of the studied sample and used as extra coverage profiles for MetaBAT2.
#additional_reads: 
# - name: sample_name
#   path: /path/to/reads.fastq

# (Optional): Reference genomes used by MetaQUAST, reference_mapping_evaluation,
# and contigs_on_reference_mapping.
reference_genomes:
#- /path/to/reference_genome.fasta
#- /path/to/other-reference_genome.fasta
# (optional), used for evaluation a csv with every line following the template "reference_genome_name, group". The names must be the same as the reference genomes files (without the path and extentions), and the groups are arbitrary
#abundance_information: /path/to/abundance.csv #

# (optional), to evaluate bins and assemblies generated by external programs
custom_assembly_path: test/test_assembly.fasta
custom_bins_path: test/test_bins/ # path to a folder containing bins in .fa format


### External programs ###
# (Optional): used for evaluation via taxonomic assignation
kraken2db: /projects/genscale/nimauric/databases/standard_kraken_database/ #must be downloaded separately
gtdbtk_database: /path/to/gtdbtk_release220/ #must be downloaded separately
mash_database: outputs/mash_db #if doesn't exist, will be created here
checkm_database: outputs/checkm_db/CheckM2_database/uniref100.KO.1.dmnd #if doesn't exist, will be created here

# (Optional): for hybrid assembly
#operaMS_path: /path/to/OPERA-MS


####################
##### Controls #####
####################

### Assembly and binning ###

# Temporary assembly files are removed by default after the final assembly.fasta is successfully generated.
# Use cleanup_tmp: "no" to keep temporary files for debugging or manual inspection no matter the outcome.
cleanup_tmp: yes

### Assembly ###
# Assemblers create contigs/assembly.fasta.
assemblers: # uncomment assemblers to use them
# - metaMDBG
# - metaflye
# - hifiasm_meta
# - metaspades
# - hylight # recommended hybrid assembler; requires hifi/ont samples with auxiliary_short_reads_1/2
# - operaMS # legacy/experimental hybrid assembler; requires hifi/ont samples with auxiliary_short_reads_1/2
 - custom_assembly # requires custom_assembly_path

### Binning ###
# Global switch for all binning analyses.
# If false, no binning mode will run.
binning: true

# Binners create bins/MAGs from contigs and read coverage.
# Currently supported: metabat2
binners: # uncomment binners to use them
#  - metabat2
 - custom # requires custom_bins_path

# Binning modes decide which read coverage is used:
long_read_binning: true # main long reads on contigs, uses: outputs/{sample}/{assembler}/reads_on_contigs.bam
short_read_binning: false # Illumina reads on metaspades assemblies, uses: outputs/{sample}/{assembler}/short_reads_on_contigs.bam
short_read_cobinning: false # long-read coverage + auxiliary short-read coverage
additional_reads_cobinning: false # main long reads + additional long-read datasets

### Evaluation ###
# contig analysis
metaquast: false # requires reference_genomes
read_mapping_evaluation: true 
short_read_mapping_evaluation: false # requires short_reads_1 and short_reads_2
reference_mapping_evaluation: false # requires reference_genomes
contigs_on_reference_mapping: false # maps assembly.fasta/contigs to reference_genomes; requires reference_genomes

# bins analysis
checkm: true
gtdbtk: false # requires gtdbtk_database and mash_database, analyses all bins
kraken2_on_bins: false #/!\ Require having done binning separatly on a previous step, requires kraken2db, analyses bins specified in kraken2_target_bins
kraken2_target_bins: #/!\ Require having done binning separatly on a previous step, requires kraken2db
 - 1

# Fractioned read quality analysis
fractions: 
#  - full # all reads
#  - mapped # reads that mapped to a contig, and were successfully assembled
  - unmapped # reads that are not mapped to a contig
fraction_evaluation_tools:
# For Illumina mapped/unmapped fractions, the extract_short_read_fractions.sh separates reads according to each read's mapping flag in the BAM.
# This means that is not a strict pair-level separation when read pairs have different mapping states.
  long_reads:
#  - nanoplot
  short_reads:
#  - fastqc
kraken2: true # requires kraken2db
kat: false

#############################
### Functional parameters ###
#############################

read_mapping_threshold: 0 #minimum total alignement length for a read to be considered mapped to a contig
metaquast_min_identity: 95

#############################
### Ressources parameters ###
#############################

